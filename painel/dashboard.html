<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Mesa Completa</title>

  <link rel="stylesheet" href="../css/painel.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="panel">
    <h1>Dashboard</h1>
    <p>Edite o conteúdo da página selecionada e clique em salvar.</p>

    <div class="field">
      <label for="pagina">Página</label>
      <select id="pagina">
        <option value="home">Home</option>
        <option value="basico">Básico</option>
        <option value="especiais">Especiais</option>
        <option value="festa-completa">Festa Completa</option>
        <option value="picnic-i">PicNic I</option>
        <option value="picnic-ii">PicNic II</option>
        <option value="premium">Premium</option>
        <option value="so-um-bolinho">Só um Bolinho</option>
        <option value="tradicional">Tradicional</option>
      </select>
    </div>

    <div class="field">
      <label for="titulo">Título</label>
      <input id="titulo" placeholder="Título da página" />
    </div>

    <div class="field">
      <label for="texto">Texto</label>
      <textarea id="texto" placeholder="Texto da página..."></textarea>
    </div>

    <div class="row">
      <button class="btn" id="btnSalvar">Salvar</button>
      <button class="btn secondary" id="btnCarregar">Carregar</button>
      <button class="btn secondary" id="btnSair">Sair</button>
    </div>

    <div class="notice" id="msg"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Init -->
  <script src="../js/firebase-init.js"></script>

  <script>
    const msg = document.getElementById("msg");
    const pagina = document.getElementById("pagina");
    const titulo = document.getElementById("titulo");
    const texto  = document.getElementById("texto");

    auth.onAuthStateChanged(user => {
      if (!user) location.href = "login.html";
    });

    async function carregar() {
      msg.textContent = "";
      const slug = pagina.value;

      const doc = await db.collection("paginas").doc(slug).get();
      if (doc.exists) {
        const d = doc.data();
        titulo.value = d.titulo || "";
        texto.value  = d.texto || "";
      } else {
        titulo.value = "";
        texto.value  = "";
      }
    }

    async function salvar() {
      msg.textContent = "";
      const slug = pagina.value;

      try {
        await db.collection("paginas").doc(slug).set({
          titulo: titulo.value,
          texto: texto.value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        msg.textContent = "Salvo com sucesso ✅";
      } catch (e) {
        msg.textContent = "Erro ao salvar: " + e.message;
      }
    }

    document.getElementById("btnSalvar").addEventListener("click", salvar);
    document.getElementById("btnCarregar").addEventListener("click", carregar);
    document.getElementById("btnSair").addEventListener("click", () => auth.signOut().then(()=>location.href="login.html"));
    pagina.addEventListener("change", carregar);

    carregar();
  </script>

</body>
</html>
