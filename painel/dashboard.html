<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Mesa Completa</title>
</head>
<body>

  <h2>Painel Admin</h2>

  <label>Página:</label>
  <select id="pagina">
    <option value="home">Home</option>
    <option value="basico">Básico</option>
    <option value="especiais">Especiais</option>
    <option value="festa-completa">Festa Completa</option>
    <option value="picnic-i">PicNic I</option>
    <option value="picnic-ii">PicNic II</option>
    <option value="premium">Premium</option>
    <option value="so-um-bolinho">Só um Bolinho</option>
    <option value="tradicional">Tradicional</option>
  </select>

  <br><br>

  <input id="titulo" placeholder="Título" style="width: 420px;"><br><br>
  <textarea id="texto" rows="10" cols="70" placeholder="Texto"></textarea><br><br>

  <button id="btnCarregar">Carregar</button>
  <button id="btnSalvar">Salvar</button>
  <button id="btnSair">Sair</button>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Init + Painel -->
  <script src="../js/firebase-init.js"></script>
  <script src="../js/painel.js"></script>

</body>
</html>
